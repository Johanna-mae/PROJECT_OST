<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="hero.css">
    <link rel="stylesheet" href="about.css">
    <link rel="stylesheet" href="project.css">
    <link rel="stylesheet" href="contact.css">

</head>

<body>

    <!-- Navigation Menus -->
    <nav class="navbar">

        <div class="nav-container">

            <a href="#home" class="logo">
                My Portfolio
            </a>

            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </div>

        </div>

    </nav>

    <!-- HERO SECTION -->
    <section id="home" class="max-w-5xl mx-auto px-6 py-24">

        <div class="grid md:grid-cols-2 gap-12 items-center">

            <div class="animate-fade-up">

                <p class="intro-text">
                    2nd Year | Aspiring to learn new things
                </p>

                <h1 class="font-heading text-5xl md:text-6xl font-bold mb-6">
                    Johanna <br>
                    Tomadong
                </h1>

                <p class="hero-subtitle text-lg leading-relaxed">
                    Reducing redundancy will make your life easier,
                    Increasing efficiency will make your work faster. <br>
                    Work today, Rest tomorrow.
                </p>

                <div class="hero-buttons">

                    <a href="#projects" class="primary-btn">
                        Explore Projects
                    </a>

                    <a href="#contact" class="secondary-btn">
                        Get in touch
                    </a>

                </div>

            </div>

            <div class="flex justify-center animate-fade-up">

                <div class="profile-frame">

                    <img src="image.jpg" alt="Profile" class="profile-image">

                </div>

            </div>

        </div>

    </section>

    

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
